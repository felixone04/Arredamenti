<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arredamenti · Showroom di arredamento e progettazione d'interni. Scopri gli ambienti, i marchi e richiedi un preventivo gratuito.">
  <meta name="theme-color" content="#F4EEE4">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arredamenti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arredamenti · Casa e design</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; height: 100%; background: #F4EEE4; }
    /* Logo d'apertura: il nome del negozio sul fondo carta, poi sfuma. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F4EEE4; color: #2B2119; padding: 0 32px;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash .logo {
      display: flex; align-items: center; gap: 18px;
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
      font-size: clamp(26px, 6vw, 46px); letter-spacing: .26em;
      opacity: 0; transform: translateY(10px);
      animation: show 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
    }
    #splash .logo i {
      display: block; width: .34em; height: .34em; background: #B5562E; transform: rotate(45deg);
    }
    #splash .tag {
      margin-top: 18px; font-family: Manrope, Arial, sans-serif; font-weight: 600;
      font-size: 11px; letter-spacing: .3em; color: #6B5A4B;
      opacity: 0; animation: show 1s ease .5s forwards;
    }
    #splash .bar { width: min(160px, 40vw); height: 1px; margin-top: 36px; background: rgba(43,33,25,.15); overflow: hidden; }
    #splash .bar b { display: block; height: 100%; background: #2B2119; transform-origin: left; transform: scaleX(0); animation: fill 1.6s ease-in-out forwards; }
    @keyframes show { to { opacity: 1; transform: none; } }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <!-- Google Identity Services: serve per collegare Google Calendar dal gestionale -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" aria-label="Arredamenti, caricamento">
    <div class="logo"><i></i>ARREDAMENTI</div>
    <div class="tag">CASA E DESIGN</div>
    <div class="bar"><b></b></div>
  </div>
  <script>
    (function () {
      var start = Date.now();
      var MIN_MS = 1100; // durata minima del logo d'apertura
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('hide');
          setTimeout(function () { s.remove(); }, 900);
        }, wait);
      });
    })();
  </script>
  <script>
    // L'avvio si scarica sempre nuovo (è piccolo): GitHub Pages lo terrebbe
    // in memoria per 10 minuti, mostrando la versione precedente.
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?t=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
